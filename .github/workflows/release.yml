name: Release

# Publishes to npm when a GitHub release is published. Needs an `NPM_TOKEN` repository secret
# (an npm automation token). The release tag must match package.json, e.g. v0.1.0.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v${VERSION}" ] || (echo "Tag ${GITHUB_REF_NAME} != v${VERSION}" && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
