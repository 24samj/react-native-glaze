name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: build/ is up to date
        run: |
          npm run build
          git diff --exit-code -- build || (echo "Run 'npm run build' and commit build/" && exit 1)
      - name: Package contents
        run: npm pack --dry-run

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform android --no-install
        working-directory: example
      # Module compile + lint first (fast feedback); third-party libraries' lint is not ours to fix
      - name: Module compile and lint
        run: >
          ./gradlew --console=plain
          :react-native-glaze:compileDebugKotlin
          :react-native-glaze:lintDebug
          -x :react-native-worklets:lintAnalyzeDebug
          -x :react-native-reanimated:lintAnalyzeDebug
          -x :expo-modules-core:lintAnalyzeDebug
          -PreactNativeArchitectures=x86_64
        working-directory: example/android
      - name: Example app
        run: ./gradlew --console=plain :app:assembleDebug -PreactNativeArchitectures=x86_64
        working-directory: example/android
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint
          path: android/build/reports/lint-results-debug.*

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      # expo-glass-effect needs the iOS 26 SDK
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform ios
        working-directory: example
      - name: Build for simulator
        working-directory: example/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=${WORKSPACE%.xcworkspace}
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build | tail -n 200
